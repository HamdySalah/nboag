<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة نبوغ</title>
<style>
  /* ===================== Design tokens ===================== */
  :root{
    /* brand colors — من دليل الهوية البصرية لنبوغ */
    --teal-100:#E8F7F3; --teal-300:#8CD4C4; --teal-600:#2E9A85; --teal-700:#1F7A69;
    --coral-100:#FEECEC; --coral-300:#FC5454; --coral-600:#D6362F; --coral-700:#B32A24;
    --pink-100:#FDF1F0; --pink-300:#F9CAC8;
    --yellow-100:#FFF8DB; --yellow-300:#FCD405; --yellow-700:#8A6E00;
    --gray-300:#D9D9D9; --gray-500:#A6A6A6;

    --bg:#F5F8F7; --surface:#FFFFFF; --surface-2:#F0F5F4;
    --border:#E3E9E7; --border-strong:#D3DBD9;
    --text:#1E2827; --text-muted:#5C6968; --text-faint:#8B9694;
    --brand:#1F7A69; --brand-soft:#E8F7F3; --brand-ring:rgba(46,154,133,.25);
    --danger:#D6362F; --danger-soft:#FEECEC;
    --warning:#8A6E00; --warning-soft:#FFF8DB;
    --pink-ink:#B85C57;

    --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(20,30,28,.06);
    --shadow-md:0 6px 20px rgba(20,30,28,.08);
    --shadow-lg:0 16px 40px rgba(20,30,28,.14);
    --sidebar-w:272px; --sidebar-w-collapsed:76px; --header-h:68px;
    --font: Tahoma,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181A; --surface:#181F21; --surface-2:#1D2527;
      --border:#283032; --border-strong:#333D3F;
      --text:#EAF0EE; --text-muted:#A8B4B1; --text-faint:#78837F;
      --brand:#79D9C3; --brand-soft:#1B2E2A; --brand-ring:rgba(121,217,195,.28);
      --danger:#FF7A70; --danger-soft:#3A1E1C;
      --warning:#FCD405; --warning-soft:#332B0C;
      --pink-ink:#F0B3AE;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 6px 20px rgba(0,0,0,.35);
      --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181A; --surface:#181F21; --surface-2:#1D2527;
    --border:#283032; --border-strong:#333D3F;
    --text:#EAF0EE; --text-muted:#A8B4B1; --text-faint:#78837F;
    --brand:#79D9C3; --brand-soft:#1B2E2A; --brand-ring:rgba(121,217,195,.28);
    --danger:#FF7A70; --danger-soft:#3A1E1C;
    --warning:#FCD405; --warning-soft:#332B0C;
    --pink-ink:#F0B3AE;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{direction:rtl;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:700;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--teal-300); color:#0B2622;}
  *:focus-visible{outline:2px solid var(--teal-600); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .icon{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none;}
  .icon-lg{width:22px; height:22px;}

  /* ===================== App shell ===================== */
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:var(--sidebar-w); flex:none; background:var(--surface); border-left:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
    transition:width .18s ease;
  }
  #sidebar.collapsed{width:var(--sidebar-w-collapsed);}
  .brand-row{display:flex; align-items:center; gap:10px; padding:18px 18px 14px; border-bottom:1px solid var(--border); flex:none;}
  .brand-mark{width:38px; height:38px; border-radius:11px; background:linear-gradient(155deg,var(--teal-300),var(--teal-600)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; flex:none; box-shadow:var(--shadow-sm);}
  .brand-name-row{display:flex; align-items:center; gap:7px;}
  .brand-name{font-size:16px; font-weight:700; color:var(--text); white-space:nowrap;}
  .brand-logo-2{width:22px; height:22px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-faint); display:flex; align-items:center; justify-content:center; flex:none;}
  .brand-sub{font-size:11px; color:var(--text-faint); white-space:nowrap;}
  #sidebar.collapsed .brand-text, #sidebar.collapsed .nav-label, #sidebar.collapsed .nav-group-title{display:none;}
  #sidebar.collapsed .brand-row{justify-content:center; padding:18px 0 14px;}
  #sidebar.collapsed .nav-item{justify-content:center; padding:10px;}

  .nav-scroll{flex:1; overflow-y:auto; padding:10px 12px 18px;}
  .nav-group{margin-top:14px;}
  .nav-group:first-child{margin-top:6px;}
  .nav-group-title{font-size:11px; color:var(--text-faint); font-weight:700; letter-spacing:.03em; padding:4px 10px 6px; text-transform:uppercase;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm);
    color:var(--text-muted); cursor:pointer; font-size:13.5px; font-weight:600; margin-bottom:2px;
    border:1px solid transparent; position:relative; user-select:none;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--brand-soft); color:var(--brand); }
  .nav-item.active .icon{stroke:var(--brand);}
  .nav-item .nav-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;}
  .nav-item .lock-mini{width:13px; height:13px; stroke:var(--text-faint); flex:none;}

  .sidebar-foot{border-top:1px solid var(--border); padding:12px; flex:none;}
  .collapse-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; font-size:12.5px; font-weight:600;}
  .collapse-btn:hover{background:var(--surface-2);}

  /* Main column */
  #main-col{flex:1; min-width:0; display:flex; flex-direction:column;}

  /* Header */
  #header{
    height:var(--header-h); flex:none; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:0 22px; position:sticky; top:0; z-index:30;
  }
  .icon-btn{width:36px; height:36px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .search-box{flex:1; max-width:380px; position:relative;}
  .search-box input{width:100%; padding:9px 38px 9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); font-size:13.5px; color:var(--text);}
  .search-box input:focus{background:var(--surface); border-color:var(--teal-600);}
  .search-box .icon{position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--text-faint);}
  .header-spacer{flex:1;}
  .header-right{display:flex; align-items:center; gap:10px;}

  .role-switch{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:999px; padding:4px; background:var(--surface-2);}
  .role-pill{padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-muted); border:none; background:transparent; white-space:nowrap;}
  .role-pill.active[data-role="super_admin"]{background:var(--brand); color:#fff;}
  .role-pill.active[data-role="content_manager"]{background:var(--pink-300); color:#5A2622;}

  .avatar{width:36px; height:36px; border-radius:50%; background:var(--teal-300); color:#0B2622; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;}
  .user-mini{display:flex; align-items:center; gap:9px; cursor:pointer; padding:4px 6px 4px 4px; border-radius:999px;}
  .user-mini:hover{background:var(--surface-2);}
  .user-mini-text{text-align:right;}
  .user-mini-name{font-size:13px; font-weight:700; color:var(--text); white-space:nowrap;}
  .user-mini-role{font-size:11px; color:var(--text-faint); white-space:nowrap;}

  .badge-dot{position:absolute; top:-2px; left:-2px; width:9px; height:9px; border-radius:50%; background:var(--coral-300); border:2px solid var(--surface);}

  /* Main content */
  #main-content{flex:1; padding:22px 26px 60px; max-width:1400px; width:100%; margin:0 auto;}
  .breadcrumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-faint); margin-bottom:10px;}
  .breadcrumb b{color:var(--text-muted); font-weight:700;}
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-title{font-size:22px; font-weight:800; color:var(--text);}
  .page-desc{font-size:13px; color:var(--text-muted); margin-top:4px; max-width:640px;}
  .page-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .scope-banner{display:flex; align-items:center; gap:10px; background:var(--pink-100); border:1px solid var(--pink-300); color:var(--pink-ink); padding:10px 14px; border-radius:var(--radius-md); font-size:12.5px; font-weight:600; margin-bottom:18px;}
  .scope-banner .icon{stroke:var(--pink-ink); flex:none;}

  /* Buttons */
  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:var(--radius-sm); font-size:13px; font-weight:700; cursor:pointer; border:1px solid transparent; white-space:nowrap;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--brand); color:#fff; box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--teal-700);}
  .btn-secondary{background:var(--surface); color:var(--text); border-color:var(--border-strong);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-ghost{background:transparent; color:var(--text-muted);}
  .btn-ghost:hover{background:var(--surface-2); color:var(--text);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-danger:hover{background:var(--coral-100); filter:brightness(.97);}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:7px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .btn-icon[disabled]{opacity:.4; cursor:not-allowed; pointer-events:none;}
  .btn-icon{width:34px; height:34px; padding:0; justify-content:center; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--border); color:var(--text-muted);}
  .btn-icon:hover{background:var(--surface-2); color:var(--text);}

  /* Cards */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
  .card-pad{padding:18px 20px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); gap:10px;}
  .card-title{font-size:14.5px; font-weight:700;}
  .card-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}

  /* Stat cards */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  @media (max-width:1180px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .stat-grid{grid-template-columns:1fr;} }

  /* Quick-access cards */
  .qa-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:1180px){ .qa-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:620px){ .qa-grid{grid-template-columns:repeat(2,1fr);} }
  .qa-card{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
    border:1px solid transparent; border-radius:var(--radius-lg); padding:20px 12px; cursor:pointer;
    box-shadow:var(--shadow-sm); transition:transform .16s ease, box-shadow .16s ease; font-family:inherit;}
  .qa-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
  .qa-card:active{transform:translateY(-1px);}
  .qa-icon{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;}
  .qa-icon .icon{width:24px; height:24px;}
  .qa-label{font-size:13px; font-weight:800; line-height:1.35;}
  /* light brand-identity tones */
  .qa-pink{background:#FDF1F0; border-color:#F9CAC8;}
  .qa-pink .qa-icon{background:#F9CAC8; color:#B85C57;} .qa-pink .qa-label{color:#9E4E49;}
  .qa-blue{background:#EAF3FB; border-color:#BFDCF3;}
  .qa-blue .qa-icon{background:#CFE4F7; color:#2F6DA8;} .qa-blue .qa-label{color:#2A5F92;}
  .qa-yellow{background:#FFF8DB; border-color:#FCE68A;}
  .qa-yellow .qa-icon{background:#FCE68A; color:#8A6E00;} .qa-yellow .qa-label{color:#7A6100;}
  .qa-teal{background:#E8F7F3; border-color:#8CD4C4;}
  .qa-teal .qa-icon{background:#B7E6DA; color:#1F7A69;} .qa-teal .qa-label{color:#1B6A5B;}
  .qa-purple{background:#F1EEFB; border-color:#D3C7F0;}
  .qa-purple .qa-icon{background:#DDD2F3; color:#6A4FB0;} .qa-purple .qa-label{color:#5C449B;}
  .qa-coral{background:#FEECEC; border-color:#F7B9B6;}
  .qa-coral .qa-icon{background:#F9C9C6; color:#C0322B;} .qa-coral .qa-label{color:#A82A24;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qa-card{filter:saturate(1.05);} }

  /* Reward section (event form) */
  .reward-section{margin-top:14px; padding:14px; border:1px dashed var(--border-strong); border-radius:var(--radius-md); background:var(--surface-2);}
  .reward-title{display:flex; align-items:center; gap:8px; font-weight:800; font-size:13.5px; color:var(--text); margin-bottom:12px;}
  .reward-title .icon{width:18px; height:18px; color:var(--brand);}
  .reward-block{margin-top:4px;}

  /* Certificates */
  .cert-thumb{border-radius:var(--radius-md) var(--radius-md) 0 0; padding:18px 16px; text-align:center; min-height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; overflow:hidden;}
  .cert-thumb-logo{width:38px; height:38px; object-fit:contain; border-radius:8px;}
  .cert-thumb-logo-ph{display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.45); border-radius:8px;}
  .cert-thumb-logo-ph .icon{width:22px; height:22px; opacity:.7;}
  .cert-thumb-title{font-weight:800; font-size:13px; letter-spacing:.5px;}
  .cert-thumb-msg{font-size:10.5px; line-height:1.5; opacity:.85; max-width:92%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .cert-preview{border-radius:var(--radius-md); padding:22px; display:flex;}
  .cert-preview-frame{flex:1; border:2px solid; border-radius:12px; padding:26px 22px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; background:rgba(255,255,255,.14);}
  .cert-preview-logo{width:64px; height:64px; object-fit:contain; border-radius:10px;}
  .cert-preview-logo-ph{width:64px; height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px dashed currentColor; border-radius:10px; opacity:.65; font-size:9px;}
  .cert-preview-logo-ph .icon{width:22px; height:22px;}
  .cert-preview-kicker{font-weight:800; letter-spacing:1px; font-size:13px; text-transform:uppercase; opacity:.85;}
  .cert-preview-name{font-weight:900; font-size:22px;}
  .cert-preview-msg{font-size:13.5px; line-height:1.9; max-width:460px;}
  .cert-preview-foot{display:flex; justify-content:space-between; width:100%; font-size:11px; opacity:.8; margin-top:6px; border-top:1px solid currentColor; padding-top:10px;}
  .cert-bg-picker{display:flex; gap:10px; flex-wrap:wrap;}
  .cert-bg-swatch{width:52px; height:38px; border-radius:9px; border:2px solid var(--border); cursor:pointer; padding:0; transition:transform .12s ease, border-color .12s ease;}
  .cert-bg-swatch:hover{transform:translateY(-2px);}
  .cert-bg-swatch.active{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ring);}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm); cursor:pointer;}
  .stat-card:hover{border-color:var(--border-strong); box-shadow:var(--shadow-md);}
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none;}
  .stat-trend{font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:3px; padding:3px 7px; border-radius:999px;}
  .trend-up{color:var(--teal-700); background:var(--teal-100);}
  .trend-down{color:var(--danger); background:var(--danger-soft);}
  .stat-value{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12.5px; color:var(--text-muted); font-weight:600;}

  /* Grid layouts */
  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  @media (max-width:980px){ .grid-2{grid-template-columns:1fr;} }
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:980px){ .grid-3{grid-template-columns:1fr;} }
  .stack{display:flex; flex-direction:column; gap:16px;}

  /* Tables */
  .table-wrap{overflow-x:auto;}
  table.dt{width:100%; border-collapse:collapse; min-width:760px;}
  table.dt th{text-align:right; font-size:11.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface-2);}
  table.dt th:first-child{border-top-right-radius:0;}
  table.dt td{padding:12px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  table.dt tbody tr:hover{background:var(--surface-2);}
  table.dt tbody tr:last-child td{border-bottom:none;}
  .cell-primary{font-weight:700; color:var(--text);}
  .cell-muted{color:var(--text-faint); font-size:12px;}
  .row-flex{display:flex; align-items:center; gap:10px;}
  .mini-avatar{width:32px; height:32px; border-radius:50%; background:var(--surface-2); color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none; border:1px solid var(--border);}

  .table-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; flex-wrap:wrap;}
  .toolbar-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1;}
  .toolbar-right{display:flex; align-items:center; gap:8px;}
  .field-input, .field-select{padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:12.5px; color:var(--text); font-family:inherit;}
  .field-input:focus, .field-select:focus{border-color:var(--teal-600);}
  .search-inline{position:relative;}
  .search-inline input{padding:8px 34px 8px 12px; min-width:210px;}
  .search-inline .icon{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--text-faint); width:15px; height:15px;}

  .pager{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .pager-info{font-size:12px; color:var(--text-faint);}
  .pager-btns{display:flex; align-items:center; gap:6px;}
  .page-num{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer;}
  .page-num.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .page-num:hover:not(.active){background:var(--surface-2);}

  /* Badges / status */
  .badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge-active{background:var(--teal-100); color:var(--teal-700);}
  .badge-inactive{background:var(--surface-2); color:var(--text-faint);}
  .badge-suspended{background:var(--danger-soft); color:var(--danger);}
  .badge-pending{background:var(--warning-soft); color:var(--warning);}
  .badge-published{background:var(--teal-100); color:var(--teal-700);}
  .badge-unpublished{background:var(--surface-2); color:var(--text-faint);}
  .badge-archived{background:var(--surface-2); color:var(--text-faint);}
  .badge-deleted{background:var(--danger-soft); color:var(--danger);}
  .badge-draft{background:var(--pink-100); color:var(--pink-ink);}
  .tag{display:inline-flex; align-items:center; padding:3px 9px; border-radius:7px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--text-muted);}

  .checkbox{width:17px; height:17px; border-radius:5px; border:1.6px solid var(--border-strong); cursor:pointer; accent-color:var(--brand);}

  /* Dropdown menu */
  .menu-wrap{position:relative; display:inline-block;}
  .menu{position:absolute; top:calc(100% + 6px); left:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); min-width:190px; padding:6px; z-index:80; display:none;}
  .menu.open{display:block;}
  .menu-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:12.8px; font-weight:600; color:var(--text); cursor:pointer;}
  .menu-item:hover{background:var(--surface-2);}
  .menu-item.danger{color:var(--danger);}
  .menu-sep{height:1px; background:var(--border); margin:5px 2px;}

  /* Toggle switch — refined Nobogh UI */
  .switch{
    position:relative; display:inline-flex; width:50px; height:28px; flex:none;
    cursor:pointer; vertical-align:middle; -webkit-tap-highlight-color:transparent;
  }
  .switch input{
    position:absolute; inset:0; width:100%; height:100%; margin:0;
    opacity:0; cursor:pointer; z-index:2;
  }
  .switch .track{
    position:absolute; inset:0; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border-strong);
    box-shadow:inset 0 1px 2px rgba(20,30,28,.06);
    transition:background .22s ease,border-color .22s ease,box-shadow .22s ease;
  }
  .switch .thumb{
    position:absolute; width:22px; height:22px; left:2px; top:2px;
    border-radius:50%; background:#fff; border:1px solid rgba(20,30,28,.08);
    box-shadow:0 2px 6px rgba(20,30,28,.18),0 1px 2px rgba(20,30,28,.10);
    transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;
  }
  .switch .thumb::after{
    content:""; position:absolute; inset:7px; border-radius:50%;
    background:var(--gray-500); opacity:.55; transition:.2s ease;
  }
  .switch:hover .track{border-color:var(--gray-500);}
  .switch:hover .thumb{box-shadow:0 3px 9px rgba(20,30,28,.22),0 1px 2px rgba(20,30,28,.12);}
  .switch input:checked + .track{
    background:var(--brand); border-color:var(--brand);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.08),0 0 0 3px rgba(46,154,133,.08);
  }
  .switch input:checked + .track .thumb{transform:translateX(24px);}
  .switch input:checked + .track .thumb::after{
    background:var(--teal-600); opacity:1;
    clip-path:polygon(14% 54%,35% 75%,84% 26%,74% 16%,35% 56%,24% 44%);
    inset:5px;
  }
  .switch input:focus-visible + .track{
    box-shadow:0 0 0 3px var(--brand-ring);
    border-color:var(--teal-600);
  }
  .switch input:active + .track .thumb{width:24px;}
  .switch input:checked:active + .track .thumb{transform:translateX(22px);}
  .switch input:disabled{cursor:not-allowed;}
  .switch input:disabled + .track{opacity:.48; cursor:not-allowed; filter:saturate(.6);}
  .switch input:disabled + .track .thumb{box-shadow:none;}

  @media (prefers-reduced-motion: reduce){
    .switch .track,.switch .thumb,.switch .thumb::after{transition:none;}
  }

  /* Empty / loading / error states */
  .state-block{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 20px; gap:12px;}
  .state-icon{width:58px; height:58px; border-radius:16px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
  .state-title{font-size:15px; font-weight:700; color:var(--text);}
  .state-desc{font-size:12.8px; color:var(--text-muted); max-width:360px;}

  .spinner{width:20px; height:20px; border-radius:50%; border:2.4px solid var(--border); border-top-color:var(--brand); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Tabs */
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); padding:0 4px;}
  .tab{padding:11px 6px; margin-bottom:-1px; font-size:13px; font-weight:700; color:var(--text-faint); cursor:pointer; border-bottom:2.5px solid transparent;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--brand); border-color:var(--brand);}

  /* Modal */
  #modal-root{position:fixed; inset:0; z-index:200; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:5vh 16px;}
  #modal-root.open{display:flex;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(15,22,20,.5); backdrop-filter:blur(1px);}
  .modal{position:relative; background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:560px; z-index:2; animation:pop .14s ease;}
  .modal.modal-lg{max-width:760px;}
  .modal.modal-sm{max-width:420px;}
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
  .modal-title{font-size:16px; font-weight:800;}
  .modal-body{padding:20px 22px; max-height:64vh; overflow-y:auto;}
  .modal-foot{display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

  /* Forms */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px; font-weight:700; color:var(--text);}
  .field label .opt{color:var(--text-faint); font-weight:500;}
  .field label .req{color:var(--danger);}
  .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=tel], .field input[type=password], .field input[type=date], .field select, .field textarea{
    padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:13px; color:var(--text); font-family:inherit; width:100%;
  }
  .field textarea{resize:vertical; min-height:74px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal-600); box-shadow:0 0 0 3px var(--brand-ring);}
  .field .hint{font-size:11.5px; color:var(--text-faint);}
  .field .err{font-size:11.5px; color:var(--danger); font-weight:600; display:none;}
  .field.invalid input, .field.invalid select, .field.invalid textarea{border-color:var(--danger);}
  .field.invalid .err{display:block;}
  .upload-box{border:1.6px dashed var(--border-strong); border-radius:var(--radius-md); padding:18px; text-align:center; color:var(--text-faint); font-size:12.5px; cursor:pointer;}
  .upload-box:hover{background:var(--surface-2); border-color:var(--teal-600);}

  /* Toasts */
  #toast-root{position:fixed; bottom:22px; left:22px; z-index:300; display:flex; flex-direction:column; gap:10px; align-items:flex-start;}
  .toast{display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-lg); border-radius:var(--radius-md); padding:12px 14px; min-width:280px; max-width:360px; animation:toastin .18s ease;}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .toast-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
  .toast.success .toast-icon{background:var(--teal-100); color:var(--teal-700);}
  .toast.error .toast-icon{background:var(--danger-soft); color:var(--danger);}
  .toast.info .toast-icon{background:var(--brand-soft); color:var(--brand);}
  .toast-title{font-size:12.8px; font-weight:700;}
  .toast-desc{font-size:11.8px; color:var(--text-muted); margin-top:1px;}
  .toast-close{margin-inline-start:auto; cursor:pointer; color:var(--text-faint); flex:none;}

  /* Charts */
  .chart-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); font-weight:600;}
  .legend-dot{width:9px; height:9px; border-radius:3px; flex:none;}

  /* Character card (age groups) */
  .char-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); display:flex; flex-direction:column;}
  .char-hero{height:120px; display:flex; align-items:center; justify-content:center; position:relative;}
  .char-avatar{width:76px; height:76px; border-radius:50%; border:4px solid var(--surface); display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:var(--shadow-md); margin-top:40px;}
  .char-badge{position:absolute; top:10px; left:10px;}

  .kbd{font-size:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-weight:700; color:var(--text-muted);}

  .hairline{height:1px; background:var(--border); border:none; margin:0;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);}
  .tiny{font-size:11.5px;}

  @media (max-width:920px){
    #sidebar{position:fixed; right:0; top:0; z-index:100; transform:translateX(100%); box-shadow:var(--shadow-lg);}
    #sidebar.mobile-open{transform:none;}
    #main-content{padding:16px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
  }

/* ==========================================================
   NOBogh Admin UI — visual redesign layer
   Brand-preserving: #8CD4C4 #FC5454 #F9CAC8 #FCD405 #D9D9D9 #A6A6A6
   ========================================================== */
:root{
  --brand-mint:#8CD4C4; --brand-coral:#FC5454; --brand-pink:#F9CAC8; --brand-yellow:#FCD405;
  --brand-gray:#A6A6A6; --brand-gray-light:#D9D9D9;
  --bg:#F7FAF9; --surface:#FFFFFF; --surface-2:#F4F8F7;
  --border:#E6ECEA; --border-strong:#D7E1DE;
  --text:#20312D; --text-muted:#62736F; --text-faint:#8C9A97;
  --brand:#2D8F7C; --brand-soft:#EDF9F6; --brand-ring:rgba(140,212,196,.38);
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
  --shadow-sm:0 2px 8px rgba(35,67,60,.055);
  --shadow-md:0 12px 32px rgba(35,67,60,.09);
  --shadow-lg:0 24px 60px rgba(35,67,60,.15);
  --font:"Dubai","29LT Massira",Tahoma,"Segoe UI",Arial,sans-serif;
}
body{background:
  radial-gradient(circle at 7% 0%,rgba(140,212,196,.10),transparent 28%),
  linear-gradient(180deg,#F8FBFA 0%,#F5F8F7 100%);letter-spacing:.005em;}
h1,h2,h3,h4,.page-title,.card-title,.stat-value{font-family:"Dubai","29LT Massira",Tahoma,sans-serif;}

/* App shell */
#sidebar{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-left:1px solid rgba(215,225,222,.9);box-shadow:-8px 0 28px rgba(35,67,60,.035);}
.brand-row{padding:15px 16px;border-bottom:1px solid var(--border);min-height:72px;}
.brand-mark{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--border);box-shadow:0 6px 18px rgba(35,67,60,.08);overflow:hidden;padding:5px;}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-name{font-size:17px;font-weight:700;}
.brand-sub{font-size:11.5px;color:var(--text-muted);}
.nav-group-label{font-size:10.5px;letter-spacing:.03em;color:var(--text-faint);font-weight:700;margin:14px 14px 6px;}
.nav-item{margin:2px 9px;border-radius:11px;padding:9px 11px;color:var(--text-muted);transition:background .16s,color .16s,transform .16s;}
.nav-item:hover{background:#F4F9F7;color:var(--text);transform:translateX(-2px);}
.nav-item.active{background:linear-gradient(90deg,rgba(140,212,196,.24),rgba(140,212,196,.11));color:#226F61;box-shadow:inset -3px 0 0 #8CD4C4;}
.nav-item.active .icon{color:#238471;}
#app-header,#header{background:rgba(255,255,255,.90)!important;backdrop-filter:blur(14px);border-bottom-color:var(--border)!important;}
#main-content{padding:26px 30px 72px;max-width:1480px;}

/* Modern unified breadcrumb */
.breadcrumb{display:inline-flex;align-items:center;gap:7px;margin:0 0 16px;padding:6px 10px 6px 8px;background:rgba(255,255,255,.82);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow-sm);font-size:11.7px;color:var(--text-faint);}
.breadcrumb .crumb-home{width:26px;height:26px;display:grid;place-items:center;border-radius:999px;background:var(--brand-soft);color:#2D8F7C;}
.breadcrumb .crumb-home .icon{width:14px;height:14px;}
.breadcrumb .crumb-sep{color:#B2BFBC;display:grid;place-items:center;}
.breadcrumb .crumb-sep .icon{width:12px;height:12px;}
.breadcrumb b{background:#F2F8F6;color:#286E60;border-radius:999px;padding:4px 9px;font-weight:700;}

/* Page heading */
.page-head{position:relative;padding:4px 2px 2px;margin-bottom:22px;align-items:center;}
.page-title{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.015em;}
.page-desc{font-size:13.5px;line-height:1.8;color:var(--text-muted);margin-top:6px;max-width:760px;}
.page-actions{gap:8px;}

/* Buttons */
.btn{min-height:38px;border-radius:11px;padding:8px 14px;font-size:12.8px;box-shadow:none;transition:transform .14s,box-shadow .14s,background .14s,border-color .14s;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:#2D8F7C;border-color:#2D8F7C;box-shadow:0 7px 16px rgba(45,143,124,.17);}
.btn-primary:hover{background:#277B6B;box-shadow:0 9px 20px rgba(45,143,124,.22);}
.btn-secondary{background:#fff;border-color:#DCE6E3;}
.btn-secondary:hover{background:#F7FAF9;border-color:#C8D8D4;}
.btn-danger{border:1px solid rgba(252,84,84,.18);background:rgba(252,84,84,.08);color:#C64242;}
.btn-ghost{color:#61716D;}
.btn-icon{width:36px;height:36px;border-radius:10px;border-color:#E0E8E6;}

/* Cards */
.card{border:1px solid rgba(222,232,229,.95);border-radius:20px;box-shadow:0 5px 18px rgba(35,67,60,.045);overflow:hidden;}
.card:hover{box-shadow:0 10px 28px rgba(35,67,60,.065);}
.card-head{padding:17px 19px;background:linear-gradient(180deg,#fff,#FCFEFD);}
.card-title{font-size:15px;font-weight:700;}
.card-sub{font-size:11.8px;color:var(--text-faint);}
.card-pad{padding:20px;}

/* Dashboard — stronger visual hierarchy */
.stat-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px;}
.stat-card{position:relative;overflow:hidden;border-radius:18px;padding:17px 18px 16px;gap:9px;min-height:132px;border:1px solid #E3ECE9;box-shadow:0 6px 18px rgba(35,67,60,.045);transition:transform .16s,box-shadow .16s,border-color .16s;}
.stat-card::after{content:"";position:absolute;inset:auto -22px -32px auto;width:92px;height:92px;border-radius:50%;background:rgba(140,212,196,.08);pointer-events:none;}
.stat-card:hover{transform:translateY(-3px);border-color:#CFE0DC;box-shadow:0 14px 30px rgba(35,67,60,.09);}
.stat-icon{width:40px;height:40px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);}
.stat-value{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.02em;}
.stat-label{font-size:12.4px;color:var(--text-muted);font-weight:600;}
.stat-trend{font-size:11px;border:1px solid rgba(45,143,124,.08);}
.grid-2{gap:18px;}.stack{gap:18px;}

/* Tables */
.table-wrap{overflow:auto;background:#fff;}
table.dt{border-collapse:separate;border-spacing:0;}
table.dt th{background:#F7FAF9;color:#72827E;font-size:11.3px;padding:12px 15px;border-bottom:1px solid #E1EAE7;text-transform:none;letter-spacing:0;}
table.dt td{padding:13px 15px;border-bottom:1px solid #EDF2F0;font-size:12.9px;}
table.dt tbody tr{transition:background .12s,box-shadow .12s;}
table.dt tbody tr:hover{background:#FAFCFB;box-shadow:inset -3px 0 0 rgba(140,212,196,.75);}
.cell-primary{font-weight:700;color:#263B36;}.cell-muted{color:#82908D;}
.table-toolbar{padding:15px 18px;background:#FCFEFD;border-bottom:1px solid #E8EFED;}
.search-inline input{min-width:240px;background:#fff;}
.field-input,.field-select{min-height:38px;border-radius:10px;border-color:#DCE5E2;background:#fff;}
.field-input:hover,.field-select:hover{border-color:#C8D7D3;}
.field-input:focus,.field-select:focus{border-color:#8CD4C4;box-shadow:0 0 0 3px rgba(140,212,196,.18);outline:none;}
.pager{background:#FCFEFD;padding:13px 18px;}
.page-num{border-radius:9px;}.page-num.active{background:#2D8F7C;border-color:#2D8F7C;}

/* Status */
.badge{padding:4px 9px;border:1px solid transparent;font-size:11px;}
.badge-active,.badge-published{background:rgba(140,212,196,.17);color:#287866;border-color:rgba(140,212,196,.28);}
.badge-suspended,.badge-deleted{background:rgba(252,84,84,.09);color:#C64747;border-color:rgba(252,84,84,.17);}
.badge-pending{background:rgba(252,212,5,.15);color:#796600;border-color:rgba(252,212,5,.26);}
.badge-draft{background:rgba(249,202,200,.28);color:#9A5E5A;border-color:rgba(249,202,200,.48);}
.tag{background:#F2F7F5;color:#657672;border:1px solid #E2EAE8;border-radius:999px;}

/* Unified notes / alerts / informational messages */
.scope-banner,.hint{border-radius:13px!important;border:1px solid rgba(140,212,196,.38)!important;background:#F0FAF7!important;color:#3F7065!important;padding:11px 13px!important;line-height:1.75!important;}
.scope-banner{box-shadow:inset 3px 0 0 #8CD4C4;font-weight:600;}
.scope-banner .icon,.hint .icon{color:#2D8F7C!important;stroke:#2D8F7C!important;flex:none;}
.hint{display:flex!important;align-items:flex-start;gap:8px;font-size:11.8px!important;}
.hint:has(.icon-alert),.hint.warning{background:#FFFBE8!important;border-color:rgba(252,212,5,.45)!important;color:#756200!important;box-shadow:inset 3px 0 0 #FCD405;}

/* Forms / modals */
.modal{border:1px solid #E0E8E6;border-radius:20px;overflow:hidden;}
.modal-head{background:#FCFEFD;padding:18px 21px;}.modal-title{font-size:17px;}
.modal-body{padding:21px;}.modal-foot{background:#FCFEFD;}
.form-grid{gap:16px;}.field{gap:7px;}.field label{font-size:12.3px;}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=tel],.field input[type=password],.field input[type=date],.field select,.field textarea{min-height:40px;border-radius:10px;border-color:#DCE5E2;background:#fff;}
.upload-box{border-radius:14px;background:#FCFEFD;border-color:#CFDBD8;padding:20px;}
.upload-box:hover{background:#F4FAF8;border-color:#8CD4C4;}

/* Toasts */
.toast{border-radius:14px;border-color:#DEE8E5;box-shadow:0 18px 42px rgba(35,67,60,.16);}
.toast-icon{border-radius:10px;}

/* Responsive */
@media(max-width:1180px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:700px){#main-content{padding:18px 14px 56px}.page-title{font-size:23px}.stat-grid{grid-template-columns:1fr}.breadcrumb{max-width:100%;overflow:auto}.page-actions{width:100%}.page-actions>.btn,.page-actions>.field-select{flex:1;justify-content:center}.table-toolbar{align-items:stretch}.toolbar-left{width:100%}.search-inline,.search-inline input{width:100%;min-width:0}}


/* ===== Requested refinements: dashboard hero, codes, stickers, fixed header ===== */
#header{position:sticky!important;top:0!important;z-index:120!important;box-shadow:0 6px 18px rgba(35,67,60,.045);}
.dashboard-welcome{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:142px;margin-bottom:20px;padding:24px 28px;border-radius:24px;color:#153D35;background:linear-gradient(118deg,#8CD4C4 0%,#BFEAE0 46%,#F9CAC8 100%);box-shadow:0 16px 36px rgba(45,143,124,.14);}
.dashboard-welcome:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.22);left:-70px;top:-95px;}
.dashboard-welcome:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(252,212,5,.18);right:36%;bottom:-96px;}
.welcome-copy,.welcome-meta{position:relative;z-index:1}.welcome-kicker{font-size:12px;font-weight:700;opacity:.7;margin-bottom:3px}.welcome-title{font-size:26px;font-weight:800;line-height:1.35}.welcome-sub{font-size:13px;margin-top:6px;opacity:.78}.welcome-meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.welcome-pill{min-width:150px;padding:12px 14px;border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.56);backdrop-filter:blur(8px);border-radius:16px}.welcome-pill-label{font-size:11px;opacity:.68;font-weight:700}.welcome-pill-value{font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}.code-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:#F2F8F6;border:1px solid #DDEAE6;color:#2D7466;font-size:10.8px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.02em}.upload-native{width:100%;padding:10px;border:1px dashed var(--border-strong);border-radius:12px;background:var(--surface-2);font-family:inherit;color:var(--text-muted)}
.sticker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sticker-card{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:14px;box-shadow:var(--shadow-sm)}.sticker-preview{height:116px;border-radius:14px;background:linear-gradient(145deg,#F5FBF9,#FFF7F7);display:grid;place-items:center;font-size:52px;border:1px solid #E7EFED;margin-bottom:12px}.sticker-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.price-free{color:#287866;background:rgba(140,212,196,.17)}.price-paid{color:#9B5A00;background:rgba(252,212,5,.18)}.price-points{color:#A44646;background:rgba(249,202,200,.30)}
@media(max-width:850px){.dashboard-welcome{align-items:flex-start;flex-direction:column}.welcome-meta{width:100%;justify-content:stretch}.welcome-pill{flex:1}.sticker-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.sticker-grid{grid-template-columns:1fr}.welcome-title{font-size:22px}}

</style>

/* ---------------- Toasts ---------------- */
function toast(type, title, desc){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const ic = type==='success'?'check':type==='error'?'x':'info';
  el.innerHTML = '<div class="toast-icon">'+icon(ic)+'</div>'+
    '<div><div class="toast-title">'+title+'</div>'+(desc?'<div class="toast-desc">'+desc+'</div>':'')+'</div>'+
    '<div class="toast-close" onclick="this.closest(\'.toast\').remove()">'+icon('x')+'</div>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),260); }, 3800);
}

/* ---------------- Modal ---------------- */
function openModal(html, size){
  const box = document.getElementById('modal-box');
  box.className = 'modal'+(size?(' modal-'+size):'');
  box.innerHTML = html;
  document.getElementById('modal-root').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal-root').classList.remove('open');
  document.body.style.overflow='';
}
function confirmDialog(opts){
  // opts: {title, desc, confirmLabel, tone:'danger'|'primary', onConfirm}
  const tone = opts.tone||'danger';
  window.__confirmCb = opts.onConfirm;
  openModal(
    '<div class="modal-body" style="padding-top:26px; text-align:center;">' +
      '<div style="width:52px;height:52px;border-radius:50%;background:'+(tone==='danger'?'var(--danger-soft)':'var(--brand-soft)')+';display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:'+(tone==='danger'?'var(--danger)':'var(--brand)')+';">'+icon('alert','icon-lg')+'</div>' +
      '<div class="modal-title" style="margin-bottom:6px;">'+opts.title+'</div>' +

/* ---------------- Chart helpers (pure SVG, no external libs) ---------------- */
function svgLine(points, w, h, color, fillColor){
  const max = Math.max(...points), min = Math.min(...points,0);
  const stepX = w/(points.length-1);
  const scaleY = v => h - ((v-min)/(max-min||1))*h;
  const coords = points.map((p,i)=>[i*stepX, scaleY(p)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area = path+' L'+w+','+h+' L0,'+h+' Z';
  let svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible;">';
  if(fillColor) svg += '<path d="'+area+'" fill="'+fillColor+'" stroke="none"/>';
  svg += '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  coords.forEach((c,i)=>{ if(i===coords.length-1){ svg += '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4.2" fill="'+color+'" stroke="white" stroke-width="1.6"/>'; } });
  svg += '</svg>';
  return svg;
}
function barChart(data, w, h, color){
  // data: [{label,value}]
  const max = Math.max(...data.map(d=>d.value))*1.15 || 1;
  const gap = 10; const bw = (w/data.length) - gap;
  let svg = '<svg viewBox="0 0 '+w+' '+(h+26)+'" style="width:100%;height:auto;">';
  data.forEach((d,i)=>{
    const bh = (d.value/max)*h;
    const x = i*(bw+gap)+gap/2, y = h-bh;
    svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="6" fill="'+color+'"/>';
    svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h+18)+'" text-anchor="middle" font-size="10.5" fill="var(--text-faint)">'+d.label+'</text>';
  });
  svg += '</svg>';
  return svg;
}
function donutChart(data, size, thickness){
  // data: [{label,value,color}]
  const total = data.reduce((s,d)=>s+d.value,0)||1;
  const r = size/2 - thickness/2; const c = size/2;
  let angle = -90; let svg = '<svg viewBox="0 0 '+size+' '+size+'" style="width:100%;height:100%;">';
  data.forEach(d=>{
    const frac = d.value/total; const deg = frac*360;
    const large = deg>180?1:0;
    const start = polar(c,c,r,angle), end = polar(c,c,r,angle+deg);
    svg += '<path d="M'+start.x.toFixed(2)+' '+start.y.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+end.x.toFixed(2)+' '+end.y.toFixed(2)+'" fill="none" stroke="'+d.color+'" stroke-width="'+thickness+'" />';
    angle += deg;
  });
  svg += '<circle cx="'+c+'" cy="'+c+'" r="'+(r-thickness/2-6)+'" fill="var(--surface)"/>';
  svg += '</svg>';
  return svg;
}
function polar(cx,cy,r,angleDeg){ const a=(angleDeg)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }

function filteredUsers(){
  const s = STATE.users;
  let list = USERS.filter(u=>{
    const tabMatch = s.tab==='المستخدمون الإداريون' ? u.type==='مستخدم إداري' : u.type!=='مستخدم إداري';
    return tabMatch &&
      (s.type==='الكل' || u.type===s.type) &&
      (s.status==='الكل' || u.status===s.status) &&
      (!s.search || (u.name+u.email+u.phone+u.id+(u.adminRole||'')).toLowerCase().includes(s.search.toLowerCase()));
  });
  list.sort((a,b)=>{
    let av=a[s.sortKey], bv=b[s.sortKey];
    if(av<bv) return s.sortDir==='asc'?-1:1;
    if(av>bv) return s.sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}

function th(label,key){
  const s = STATE.users;
  const active = s.sortKey===key;
  return '<th style="cursor:pointer;user-select:none;" onclick="App.usersSort(\''+key+'\')">'+label+' '+(active?(s.sortDir==='asc'?'▲':'▼'):'<span style="opacity:.3">↕</span>')+'</th>';
}
function pageNumbers(current,total,fn){
  let html='';
  const pages = [];
  for(let i=1;i<=total;i++){ if(i===1||i===total||Math.abs(i-current)<=1) pages.push(i); else if(pages[pages.length-1]!=='…') pages.push('…'); }
  pages.forEach(p=>{
    if(p==='…') html += '<span class="faint" style="padding:0 4px;">…</span>';
    else html += '<button class="page-num '+(p===current?'active':'')+'" onclick="'+fn+'('+p+')">'+p+'</button>';
  });
  return html;
}

function activitiesTabContent(){
  const s = STATE.activities;
  const all = filteredActivities();
  const totalPages = Math.max(1, Math.ceil(all.length/s.perPage));
  s.page = Math.min(s.page,totalPages);
  const rows = all.slice((s.page-1)*s.perPage, s.page*s.perPage);
  const canDestructive = canManage('activities');
  let html = '';
  html += '<div class="card"><div class="table-toolbar"><div class="toolbar-left">'+
    '<div class="search-inline"><input class="field-input" placeholder="ابحث باسم النشاط…" value="'+s.search+'" oninput="App.actSetSearch(this.value)"/>'+icon('search')+'</div>'+
    '<select class="field-select" onchange="App.actSetFilter(\'domain\',this.value)">'+['الكل',...DOMAINS].map(o=>'<option '+(s.domain===o?'selected':'')+'>'+o+'</option>').join('')+'</select>'+
    '<select class="field-select" onchange="App.actSetFilter(\'age\',this.value)">'+['الكل',...AGE_LABELS].map(o=>'<option '+(s.age===o?'selected':'')+'>'+o+'</option>').join('')+'</select>'+
    '<select class="field-select" onchange="App.actSetFilter(\'status\',this.value)">'+['الكل','منشور','غير منشور','بانتظار الاعتماد','مؤرشف'].map(o=>'<option '+(s.status===o?'selected':'')+'>'+o+'</option>').join('')+'</select>'+
  '</div></div>';

  html += '<div class="table-wrap"><table class="dt"><thead><tr><th>النشاط</th><th>المجال</th><th>الفئة العمرية</th><th>الصعوبة</th><th>المدة</th><th>النوع</th><th>النقاط</th><th>التنفيذ</th><th>الحالة</th><th style="width:60px;"></th></tr></thead><tbody>';
  if(!rows.length){
    html += '<tr><td colspan="10"><div class="state-block" style="padding:40px 0;"><div class="state-icon">'+icon('zap','icon-lg')+'</div><div class="state-title">لا توجد أنشطة مطابقة</div><div class="state-desc">جرّب تعديل الفلاتر أعلاه.</div></div></td></tr>';
  }
  rows.forEach(a=>{
    html += '<tr><td><div class="cell-primary">'+a.name+'</div><div class="cell-muted">'+a.id+' · '+a.source+'</div></td>'+
    '<td>'+(a.domain?'<span class="tag">'+a.domain+'</span>':'<span class="tiny faint">بدون مجال</span>')+'</td><td>'+a.age+'</td>'+
    '<td>'+levelBadge(a.level)+'</td><td>'+a.duration+'</td>'+
    '<td>'+(a.free?'<span class="tag" style="background:var(--teal-100); color:var(--teal-700);">مجاني</span>':'<span class="tag" style="background:var(--yellow-100); color:var(--yellow-700);">مدفوع</span>')+'</td>'+
    '<td style="font-variant-numeric:tabular-nums;">'+a.points+'</td>'+
    '<td style="font-variant-numeric:tabular-nums;">'+fmtNum(a.runs)+'</td>'+
    '<td>'+statusBadge(a.status)+'</td>'+
    '<td>'+rowMenuGeneric(a.id,[
      ['eye','معاينة',"App.activityPreview('"+a.id+"')"],
      ['edit2','تعديل',"App.activityOpenForm('"+a.id+"')"],
      ['copy','نسخ',"App.activityDuplicate('"+a.id+"')"],
      a.status==='منشور'? ['x','إيقاف النشر',"App.activityUnpublish('"+a.id+"')"] : ['send','نشر',"App.activityPublish('"+a.id+"')"],
      ['archive','أرشفة',"App.activityArchive('"+a.id+"')"],
      canDestructive? null : null,
      ['trash','حذف',"App.activityDelete('"+a.id+"')",true],
    ])+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="pager"><div class="pager-info">عرض '+rows.length+' من أصل '+all.length+' نشاط</div><div class="pager-btns">'+
    '<button class="page-num" onclick="App.actGoPage('+(s.page-1)+')" '+(s.page<=1?'disabled':'')+'>'+icon('chevright')+'</button>'+
    pageNumbers(s.page,totalPages,'App.actGoPage')+
    '<button class="page-num" onclick="App.actGoPage('+(s.page+1)+')" '+(s.page>=totalPages?'disabled':'')+'>'+icon('chevleft')+'</button>'+
  '</div></div></div>';
  return html;
}

/* ================= Impact dashboard ================= */
const IMPACT_TIMELINE=[62,66,71,69,75,80];
function childImpactSeed(id){ let h=0; for(let i=0;i<id.length;i++){ h=(h*31+id.charCodeAt(i))>>>0; } return h; }
function childImpactData(c){
  const h = childImpactSeed(c.id);
  const base = 45 + (h%35);
  const weeks = [0,1,2,3].map(i => Math.min(97, base + i*(3+((h>>(i*3))&7))));
  return {
    commitment: weeks[weeks.length-1],
    avgAchievements: (2 + ((h%18)/2)).toFixed(1),
    badges: c.badges,
    recommendations: 2 + (h%5),
    weeks,
    timeline: [0,1,2,3,4,5].map(i => Math.min(97, Math.max(30, base - 10 + i*(2+((h>>(i*2))&9))))),
  };
}
function childActivityLog(c){
  const h = childImpactSeed(c.id);
  const pool = ACTIVITIES.filter(a=>a.status==='منشور');
  const linkedSurveyActivities = pool.filter(a => SURVEYS.some(v=>v.type==='استبيان نشاط' && v.title==='استبيان نشاط: '+a.name));
  const highlightPoolSrc = linkedSurveyActivities.length ? linkedSurveyActivities : pool;
  const highlightAct = highlightPoolSrc[h % highlightPoolSrc.length];
  const highlightSurvey = SURVEYS.find(v=>v.title==='استبيان نشاط: '+highlightAct.name);
  const runsCount = 3 + (h % 5);
  const others = pool.filter(a=>a.id!==highlightAct.id);
  const chosenIds = new Set();
  const rows = [];
  for(let i=0; i<others.length && rows.length<4; i++){
    const a = others[(h + i*7) % others.length];
    if(chosenIds.has(a.id)) continue;
    chosenIds.add(a.id);
    const times = 1 + ((h>>(i*3)) & 3);
    const dayOffset = 2 + ((h>>(i*2)) & 20);
    rows.push({ activity:a, times, lastDate:'2026-08-'+String(Math.max(1, 26-dayOffset)).padStart(2,'0') });
  }
  const beforePct = 40 + (h%15);
  const afterPct = Math.min(96, beforePct + 18 + (h%20));
  const satisfaction = (3.6 + ((h%14)/10)).toFixed(1);
  return { highlightAct, highlightSurvey, runsCount, rows, beforePct, afterPct, satisfaction };
}

  const byParent = CHILDREN.filter(c=>!(c.institutions&&c.institutions.length));

function surveyResultsHtml(v){
  const isActivity = v.type==='استبيان نشاط';
  const activityName = isActivity ? v.title.replace('استبيان نشاط: ','').replace('استبيان نشاط:','').trim() : '';
  const kids = CHILDREN.filter(c=>c.parent);
  const n = Math.min(8, kids.length);
  const rows = [];
  for(let i=0;i<n;i++){
    const c = kids[i];
    const inst = (c.institutions&&c.institutions.length)? c.institutions[0] : pick(INSTITUTIONS_NAMES);
    const phone = '05'+String(rnd(10000000,99999999));
    const rating = rnd(3,5);
    const when = '2026-08-'+String(rnd(10,29));
    rows.push({activity: isActivity? activityName : 'استبيان عام', child:c.name, code:c.code, parent:c.parent, phone, inst, rating, when});
  }
  const avg = rows.length? (rows.reduce((s,r)=>s+r.rating,0)/rows.length) : 0;
  const completion = rnd(72,96);
  const stars = r => '<span style="color:var(--yellow-700); font-variant-numeric:tabular-nums;">'+r+'/5</span>';
  const QSET = isActivity
    ? ['وضوح تعليمات النشاط','مناسبة النشاط لعمر الطفل','تفاعل الطفل واستمتاعه','ملاحظة تحسّن في المهارة المستهدفة']
    : ['سهولة استخدام المنصة','جودة المحتوى التعليمي','رضاك عن التواصل والدعم','مدى توصيتك بنبوغ لغيرك'];
  let html = '<div class="modal-head"><div><div class="modal-title">نتائج: '+v.title+'</div><div class="tiny faint" style="margin-top:3px;"><span class="tag">'+v.type+'</span>'+(isActivity?' · النشاط: '+activityName:'')+'</div></div><button class="btn-icon" onclick="closeModal()">'+icon('x')+'</button></div>';
  html += '<div class="modal-body">';
  html += '<div class="stat-grid" style="grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:16px;">'+
    '<div class="stat-card"><div class="stat-value">'+fmtNum(v.responses)+'</div><div class="stat-label">عدد الإجابات</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+avg.toFixed(1)+'<span class="tiny faint">/5</span></div><div class="stat-label">متوسط التقييم</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+completion+'%</div><div class="stat-label">نسبة إكمال الاستبيان</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+v.questions+'</div><div class="stat-label">عدد الأسئلة</div></div>'+
  '</div>';
  html += '<div class="card" style="margin-bottom:16px;"><div class="card-head"><div class="card-title">ملخّص نتائج الأسئلة</div></div><div class="card-pad" style="display:flex; flex-direction:column; gap:12px;">'+
    QSET.map(q=>{ const pct=rnd(62,95); return '<div><div class="row-flex" style="justify-content:space-between; margin-bottom:4px;"><span class="tiny" style="font-weight:600;">'+q+'</span><span class="tiny faint">'+pct+'%</span></div><div style="height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden;"><div style="height:100%; width:'+pct+'%; background:var(--brand); border-radius:6px;"></div></div></div>'; }).join('')+
  '</div></div>';
  html += '<div class="card"><div class="card-head"><div class="card-title">تفاصيل الإجابات حسب الطفل وولي الأمر</div></div>'+
    '<div class="table-wrap"><table class="dt"><thead><tr>'+(isActivity?'<th>النشاط</th>':'<th>نوع الاستبيان</th>')+'<th>الطفل</th><th>ولي الأمر</th><th>جوال ولي الأمر</th><th>المؤسسة</th><th>النتيجة</th><th>التاريخ</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td class="cell-muted">'+r.activity+'</td><td><div class="cell-primary">'+r.child+'</div><div class="tiny faint" style="margin-top:2px;">'+r.code+'</div></td><td>'+r.parent+'</td><td dir="ltr" style="font-variant-numeric:tabular-nums;">'+r.phone+'</td><td>'+r.inst+'</td><td>'+stars(r.rating)+'</td><td class="cell-muted">'+r.when+'</td></tr>').join('')+
    '</tbody></table></div></div>';
  html += '</div><div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>'+
    '<button class="btn btn-primary" onclick="App.doExport(\'Excel\',\'نتائج '+v.title.replace(/'/g,"")+'\')">'+icon('download')+'تصدير Excel</button></div>';

function featureCellValue(p,f){
  const v = p[f.key];
  if(f.kind==='bool') return v? '<span style="color:var(--brand);">'+icon('check')+'</span>' : '<span class="faint">'+icon('x')+'</span>';
  if(f.kind==='count') return (v===undefined||v===null||v==='')? '<span class="faint">—</span>' : (typeof v==='number'? fmtNum(v)+' '+(f.unit||'') : v);
  if(f.kind==='list') return (v&&v.length)? v.join('، ') : '<span class="faint">—</span>';
  return (v===undefined||v===null||v==='')? '<span class="faint">—</span>' : v;

  linkRequestCreate(){
    const form=document.getElementById('link-create-form');
    if(!validateForm(form)){ toast('error','تحقق من الحقول المطلوبة'); return; }
    const data=Object.fromEntries(new FormData(form).entries());
    const toParent = (data.dir||'').indexOf('ولي الأمر')!==-1;
    const inst = data.institution;
    const instIdx = INSTITUTIONS_NAMES.indexOf(inst);
    const institutionCode = 'NBG-INS-'+String(1001+(instIdx<0?0:instIdx));
    let childName, parentName, childObj;
    if(toParent){
      parentName = data.parent;
      childObj = CHILDREN.find(c=>c.parent===parentName);
      childName = childObj? childObj.name : '—';
    } else {
      childName = data.child;
      childObj = CHILDREN.find(c=>c.name===childName);
      parentName = childObj && childObj.parent ? childObj.parent : '—';
    }
    const now = new Date();
    const pad=n=>String(n).padStart(2,'0');
    const stamp = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
    LINK_REQUESTS.unshift({
      id:'LR-'+rnd(1100,1999),
      childId: childObj? childObj.id : '',
      child: childName,
      childCode: childObj? childObj.code : '—',
      parent: parentName,
      institutionId:'INS-'+String(instIdx<0?1:instIdx+1).padStart(2,'0'),
      institution: inst,
      institutionCode: institutionCode,
      initiatedBy:'مدير النظام',
      requestedAt: stamp,
      status: toParent ? 'بانتظار موافقة ولي الأمر' : 'بانتظار موافقة المؤسسة',
      note: 'طلب ارتباط أنشأه مدير النظام.'

  landingPartnerAdd(pageId, sectionId){ const l=LANDING_PAGES.find(x=>x.id===pageId); const s=l.sections.find(x=>x.id===sectionId);
    const name=document.getElementById('pt-name').value; const logo=document.getElementById('pt-logo').value;
    if(!name){ toast('error','الرجاء إدخال اسم الشريك'); return; }
    s.items=s.items||[]; s.items.push({name, logo:logo||'🏢'});
    toast('success','تمت إضافة الشريك'); openModal(landingSectionFormHtml(pageId, sectionId), 'lg'); },
  landingPartnerDelete(pageId, sectionId, idx){ const l=LANDING_PAGES.find(x=>x.id===pageId); const s=l.sections.find(x=>x.id===sectionId); s.items.splice(idx,1); toast('success','تم الحذف'); openModal(landingSectionFormHtml(pageId, sectionId), 'lg'); },

  /* ---- Data management ---- */
  dmSetSearch(v){ STATE.dataManagement.search=v; renderPage(); },
  dmSetEntity(v){ STATE.dataManagement.entity=v; renderPage(); },
  dmRestore(id){ const d=DELETED_RECORDS.find(x=>x.id===id); confirmDialog({title:'استعادة العنصر؟', desc:'سيتم استعادة «'+d.name+'» إلى حالته قبل الحذف.', tone:'primary', confirmLabel:'استعادة', onConfirm(){ DELETED_RECORDS.splice(DELETED_RECORDS.indexOf(d),1); renderPage(); toast('success','تمت الاستعادة بنجاح'); } }); },

  /* ---- Audit log ---- */
  auditSetSearch(v){ STATE.auditLog.search=v; renderPage(); },
  auditSetResult(v){ STATE.auditLog.result=v; renderPage(); },

  /* ---- Settings ---- */
  settingsSetTab(t){ STATE.settingsPage.tab=t; renderPage(); },
};

/* ---------------- Init ---------------- */
renderSidebar();
renderHeader();
renderPage();
</script>

</body>
