    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2fbba6"/><stop offset="1" stop-color="#0f6659"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7d6"/><stop offset="1" stop-color="#ffebe8"/></linearGradient>
    <style>
      text{font-family:'DejaVu Sans',sans-serif;fill:#153b37;direction:ltr;unicode-bidi:plaintext}.t{font-weight:700}.muted{fill:#56706b}.tiny{font-size:16px}.small{font-size:20px}.med{font-size:26px}.large{font-size:38px}.xl{font-size:52px;font-weight:700}.white{fill:#fff}.line{stroke:#d8ebe6;stroke-width:2}.panel{fill:#fff;stroke:#d8ebe6;stroke-width:2;filter:url(#shadow)}
